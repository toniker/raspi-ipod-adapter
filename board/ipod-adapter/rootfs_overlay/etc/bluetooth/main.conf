[General]
# Device name - this will appear when devices scan for Bluetooth
Name = VOLVO Audio

# Device class: service class Audio (0x200000) + major Audio/Video (0x04)
# + minor Car Audio (0x08). The previous value (0x00000420) dropped the
# Audio service-class bit, which phones use for discovery/auto-connect
# filtering.
Class = 0x200420

# Discoverable/pairable mode never times out once enabled. (Enabling it
# in the first place is the S45bt-audio init script's job -- bluetoothctl
# discoverable on. Pairable defaults to true in BlueZ already.)
DiscoverableTimeout = 0
PairableTimeout = 0

[Policy]
# Power the adapter on automatically when bluetoothd starts, instead of
# requiring an explicit "power on".
AutoEnable = true
